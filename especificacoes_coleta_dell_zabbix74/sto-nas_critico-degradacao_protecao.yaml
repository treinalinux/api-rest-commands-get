    - uuid: b81a25b8f9204687877608452f47ac29
      name: 'unity: replication failed'
      expression: (max(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed],15m)=0) and
        (find(/sto-nas_critico-degradacao_protecao/unity.protecao.message[replication_failed],#1,"regexp","^")>=0
        or 1=1) and (last(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed],#1:now-15m)=0
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed],#1:now-15m)>15m
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed],#1:now-15m)<=15m+{$UNITY.API.INTERVAL}
        and count(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed],15m)>=ceil(15m/{$UNITY.API.INTERVAL}))
        and last(/sto-nas_critico-degradacao_protecao/unity.protecao.available[replication_failed])=1 and ((nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.json.revision,1h)=0
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.json.revision)<=1h) and (nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.api.receipt,{$UNITY.API.NODATA})=0
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.api.receipt)<={$UNITY.API.NODATA})
        and (nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.source.timestamp[replication_failed],{$UNITY.SOURCE.MAX_AGE})=0
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.source.timestamp[replication_failed])<={$UNITY.SOURCE.MAX_AGE}))
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: (last(/sto-nas_critico-degradacao_protecao/unity.protecao.state[replication_failed])="not_applicable"
        or (last(/sto-nas_critico-degradacao_protecao/unity.protecao.available[replication_failed])=1 and (last(/sto-nas_critico-degradacao_protecao/unity.protecao.status[replication_failed])=1)))
        and ((nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.json.revision,1h)=0 and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.json.revision)<=1h)
        and (nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.api.receipt,{$UNITY.API.NODATA})=0 and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.api.receipt)<={$UNITY.API.NODATA})
        and (nodata(/sto-nas_critico-degradacao_protecao/unity.protecao.source.timestamp[replication_failed],{$UNITY.SOURCE.MAX_AGE})=0
        and now()-lastclock(/sto-nas_critico-degradacao_protecao/unity.protecao.source.timestamp[replication_failed])<={$UNITY.SOURCE.MAX_AGE}))
      priority: HIGH
      description: |-
        replicacao em falha por mais de 15m.
        usa o limite configurado na macro, quando aplicavel.
        dados desconhecidos ou velhos nao comprovam recuperacao.
      opdata: |-
        valor: {ITEM.LASTVALUE1}; detalhes: {{ITEM.LASTVALUE2}.regsub("(?s)(.*)", \1)}
      tags:
        - tag: categoria
          value: protecao
        - tag: evento
          value: replication_failed
