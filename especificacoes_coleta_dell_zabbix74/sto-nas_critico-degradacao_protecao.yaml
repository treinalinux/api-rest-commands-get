              parameters:
                - OK
                - ok
            - type: STR_REPLACE
              parameters:
                - WARNING
                - warning
            - type: STR_REPLACE
              parameters:
                - CRITICAL
                - critical
            - type: STR_REPLACE
              parameters:
                - OPERATIONAL
                - operational
            - type: STR_REPLACE
              parameters:
                - UNKNOWN
                - unknown
            - type: STR_REPLACE
              parameters:
                - NOT_APPLICABLE
                - not_applicable
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: replication_failed
