          type: DEPENDENT
          key: unity.protecao.available[replication_failed]
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = coleta completa, estado conhecido, timestamp e campo da trigger utilizaveis; 0 = indisponivel. a trigger verifica tambem a atualizacao observada deste evento e o recebimento da api.
          preprocessing:
