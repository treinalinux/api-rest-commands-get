        - uuid: cd54ca74093c4d20baa7f7b3ba647df7
          name: 'unity: certificate expiring: medicao disponivel'
          type: DEPENDENT
          key: unity.protecao.available[certificate_expiring]
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = coleta completa, estado conhecido, timestamp e campo da trigger utilizaveis; 0 = indisponivel. a trigger verifica tambem a atualizacao observada deste evento e o recebimento da api.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.certificate_expiring.event_details.collection.status=="collected" && @.certificate_expiring.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.certificate_expiring.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.certificate_expiring.event_details.metrics.days_to_expire=~"^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$")].certificate_expiring.event_details.collection.status.first()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: REGEX
              parameters:
                - ^collected$
                - '1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: certificate_expiring
        - uuid: e446721304794483913e00429e0681b8
          name: 'unity: expiracao do certificado: dias para expiracao do certificado'
          type: DEPENDENT
          key: unity.protecao.metric[certificate_expiring,days_to_expire]
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          description: |-
            metrica numerica com historico; null, unknown e coleta incompleta sao descartados. uma copia identica do evento nao cria amostras; zero real e preservado.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.certificate_expiring.event_details.collection.status=="collected" && @.certificate_expiring.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.certificate_expiring.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.certificate_expiring.event_details.metrics.days_to_expire=~"^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$")].certificate_expiring.first()
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
              parameters: []
            - type: JSONPATH
              parameters:
                - $.event_details.metrics.days_to_expire
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: certificate_expiring
            - tag: metrica
              value: days_to_expire
          units: '!dias'
