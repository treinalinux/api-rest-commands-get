# unity - zabbix 7.4 - jsonpath fixo - somente operacoes nativas
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 40d2ea9a4b3549f4a58c288afee574ed
      name: templates/storage
  templates:
    - uuid: 9dede79b7fcd4c84a0e0f891a0a3031b
      template: sto-nas_critico-degradacao_protecao
      name: sto-nas_critico-degradacao_protecao
      description: |-
        unity: eventos de protecao.
        jsonpath fixo, sem lld, com uma trigger por evento.
        endereco base e token nas macros globais do zabbix.
        nome tecnico do host igual ao identificador usado pela api.
        textos de apresentacao em minusculas e sem acentos.
        metricas: historico de 90d e tendencias de 365d.
      groups:
        - name: templates/storage
      items:
        - type: HTTP_AGENT
          key: unity.protecao.api.json
          delay: '{$UNITY.API.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          url: '{$UNITY.API.BASE_URL}/devices/unity/{HOST.HOST}'
          request_method: GET
          timeout: '{$UNITY.API.TIMEOUT}'
          status_codes: '200'
          retrieve_mode: BODY
          output_format: RAW
          headers:
            - name: x-api-token
              value: '{$UNITY.API.TOKEN}'
            - name: accept
              value: application/json
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^\s*(\{.*\})\s*$
                - '[\1]'
            - type: JSONPATH
              parameters:
                - $[0]
            - type: MATCHES_REGEX
              parameters:
                - (?s)^(?=.*"device_info"\s*:\s*\{)(?=.*"events"\s*:\s*\{).*
          uuid: b7310eaf63354fe1ae1740e58f724e08
          name: 'unity: json completo: protecao'
          description: consulta get ao json original da api; corpo completo somente em transito, sem historico.
          tags:
            - tag: categoria
              value: protecao
          verify_peer: 'YES'
          verify_host: 'YES'
          follow_redirects: 'NO'
        - uuid: f810ccb63b5f47e386d4db377b44053e
          name: 'unity: resposta json utilizavel: protecao'
          type: DEPENDENT
          key: unity.protecao.api.receipt
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            sinal de recebimento; continua atualizando com http 200 e corpo identico. nao e uma medida do equipamento.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
        - uuid: b54bc80df00e4cb7a7ab7f499f4bb9de
          name: 'unity: contrato json valido: protecao'
          type: DEPENDENT
          key: unity.protecao.contract.valid
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = campos e metadados da categoria presentes no formato esperado; 0 = erro de contrato. nao bloqueia as outras categorias.
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^(.*)$
                - '[\1]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: JSONPATH
              parameters:
                - $[?(@.device_info.name=~"^(?!null$)\\S.*$" && @.events.replication_failed.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.replication_failed.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.replication_failed.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.replication_lag.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.replication_lag.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.replication_lag.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.nfs_service.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.nfs_service.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.nfs_service.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.smb_service.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.smb_service.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.smb_service.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.audit_disabled.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.audit_disabled.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.audit_disabled.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.unauthorized_admin.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.unauthorized_admin.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.unauthorized_admin.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.certificate_expiring.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.certificate_expiring.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.certificate_expiring.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.ransomware_pattern.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.ransomware_pattern.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.ransomware_pattern.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$")].length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
        - uuid: f7240f1675da420b8f7169d7021e9472
          name: 'unity: alteracao do corpo json: protecao'
          type: DEPENDENT
          key: unity.protecao.json.change
          delay: '0'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |-
            controle interno: descarta corpos identicos; o primeiro corpo inicia a observacao.
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters: []
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
        - uuid: 3fd12771f3e746baa5c4dd1edaa19e83
          name: 'unity: sinal de alteracao do json: protecao'
          type: DEPENDENT
          key: unity.protecao.json.revision
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            registra 1 apenas quando o corpo json muda. lastclock mede a ultima mudanca observada.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.protecao.json.change
          tags:
            - tag: categoria
              value: protecao
        - uuid: 806224b00671487898d18941528865f4
          name: 'unity: horario observado da ultima alteracao: protecao'
          type: CALCULATED
          key: unity.protecao.json.timestamp
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          units: unixtime
          params: lastclock(//unity.protecao.json.revision)
          description: horario unix em que o zabbix observou a ultima alteracao; nao converte o timestamp iso do
            construtor.
          tags:
            - tag: categoria
              value: protecao
        - uuid: 9a1b4c82fe9e40dbbd2f25bef665cc90
          name: 'unity: tempo sem alteracao do json: protecao'
          type: CALCULATED
          key: unity.protecao.json.age
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: s
          params: now()-lastclock(//unity.protecao.json.revision)
          description: segundos desde a ultima alteracao observada; cresce mesmo quando a api responde 200 com o
            mesmo corpo.
          tags:
            - tag: categoria
              value: protecao
        - uuid: ec2d4c2e301442af88f0cbe914f17a13
          name: 'unity: replication failed: timestamp da fonte'
          type: DEPENDENT
          key: unity.protecao.source.timestamp[replication_failed]
          delay: '0'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |-
            timestamp iso original; registra apenas mudancas da fonte. lastclock mede quando essa mudanca foi observada, sem converter a data iso.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.events.replication_failed.event_metadata.timestamp
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$
              error_handler: DISCARD_VALUE
            - type: STR_REPLACE
              parameters:
                - T
                - t
            - type: STR_REPLACE
              parameters:
                - Z
                - z
            - type: DISCARD_UNCHANGED
              parameters: []
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: replication_failed
        - uuid: 5c9a1e3ebeaf4735892c207b697ec100
          name: 'unity: replication failed: coleta'
          type: DEPENDENT
          key: unity.protecao.source.collection[replication_failed]
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |-
            qualidade da coleta: collected, partial, unavailable, unsupported, not_applicable ou invalid.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.events.replication_failed.event_details.collection.status
              error_handler: CUSTOM_VALUE
              error_handler_params: invalid
            - type: MATCHES_REGEX
              parameters:
                - ^(collected|partial|unavailable|unsupported|not_applicable)$
              error_handler: CUSTOM_VALUE
              error_handler_params: invalid
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: replication_failed
        - uuid: c8a369ce3bd740c6b826ccdc7e7adc01
          name: 'unity: replication failed: estado'
          type: DEPENDENT
          key: unity.protecao.state[replication_failed]
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |-
            estado original normalizado para apresentacao; unknown nao representa saudavel.
          preprocessing:
