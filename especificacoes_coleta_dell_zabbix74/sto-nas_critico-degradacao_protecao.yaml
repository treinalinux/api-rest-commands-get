        - uuid: d01b62365c8a48038001a558ddced9d7
          name: 'unity: smb service: medicao disponivel'
          type: DEPENDENT
          key: unity.protecao.available[smb_service]
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = coleta completa, estado conhecido, timestamp e campo da trigger utilizaveis; 0 = indisponivel. a trigger verifica tambem a atualizacao observada deste evento e o recebimento da api.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.smb_service.event_details.collection.status=="collected" && @.smb_service.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.smb_service.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$")].smb_service.event_details.collection.status.first()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: REGEX
              parameters:
                - ^collected$
                - '1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: smb_service
        - uuid: ee3f823f910b479cbc9f47618c42d70a
          name: 'unity: servico smb: configurado (1=sim; 0=nao)'
          type: DEPENDENT
          key: unity.protecao.metric[smb_service,is_configured]
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          description: |-
            metrica numerica com historico; null, unknown e coleta incompleta sao descartados. uma copia identica do evento nao cria amostras; zero real e preservado.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.smb_service.event_details.collection.status=="collected" && @.smb_service.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.smb_service.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.smb_service.event_details.metrics.is_configured=~"^(true|false|0|1)$")].smb_service.first()
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
              parameters: []
            - type: JSONPATH
              parameters:
                - $.event_details.metrics.is_configured
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^(true|false|0|1)$
              error_handler: DISCARD_VALUE
            - type: BOOL_TO_DECIMAL
              parameters: []
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: smb_service
            - tag: metrica
              value: is_configured
        - uuid: 4d52252935244b59be19d8220e9f7da0
          name: 'unity: smb service: status numerico'
          type: DEPENDENT
          key: unity.protecao.status[smb_service]
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            0 = falha; 1 = saudavel; 2 = desconhecido. desconhecido interrompe a janela de falha continua.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.smb_service.event_details.collection.status=="collected" && @.smb_service.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.smb_service.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$")].smb_service.component_health_status.first()
              error_handler: CUSTOM_VALUE
              error_handler_params: '2'
            - type: STR_REPLACE
              parameters:
                - CRITICAL
                - '0'
            - type: STR_REPLACE
              parameters:
                - WARNING
                - '0'
            - type: STR_REPLACE
              parameters:
                - OPERATIONAL
                - '0'
            - type: STR_REPLACE
              parameters:
                - OK
                - '1'
            - type: MATCHES_REGEX
              parameters:
                - ^[012]$
              error_handler: CUSTOM_VALUE
              error_handler_params: '2'
          master_item:
            key: unity.protecao.api.json
          tags:
            - tag: categoria
              value: protecao
            - tag: evento
              value: smb_service
        - uuid: a8fc103fbff54b1081c079f111d89086
          name: 'unity: audit disabled: timestamp da fonte'
