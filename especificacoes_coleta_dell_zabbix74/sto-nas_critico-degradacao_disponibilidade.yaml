          type: CALCULATED
          key: unity.disponibilidade.metric[multiple_disk_failure,healthy_disks]
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: 365d
          value_type: FLOAT
          params: (last(//unity.disponibilidade.metric[multiple_disk_failure,total_disks])-last(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks]))/(last(//unity.disponibilidade.available[multiple_disk_failure])=1
            and nodata(//unity.disponibilidade.metric[multiple_disk_failure,total_disks],1h)=0 and nodata(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks],1h)=0
            and lastclock(//unity.disponibilidade.metric[multiple_disk_failure,total_disks])=lastclock(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks])
            and last(//unity.disponibilidade.metric[multiple_disk_failure,total_disks])>=last(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks])
            and last(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks])>=0 and floor(last(//unity.disponibilidade.metric[multiple_disk_failure,total_disks]))=last(//unity.disponibilidade.metric[multiple_disk_failure,total_disks])
            and floor(last(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks]))=last(//unity.disponibilidade.metric[multiple_disk_failure,failed_disks])
            and ((nodata(//unity.disponibilidade.json.revision,1h)=0 and now()-lastclock(//unity.disponibilidade.json.revision)<=1h)
            and (nodata(//unity.disponibilidade.api.receipt,{$UNITY.API.NODATA})=0 and now()-lastclock(//unity.disponibilidade.api.receipt)<={$UNITY.API.NODATA})
            and (nodata(//unity.disponibilidade.source.timestamp[multiple_disk_failure],{$UNITY.SOURCE.MAX_AGE})=0
            and now()-lastclock(//unity.disponibilidade.source.timestamp[multiple_disk_failure])<={$UNITY.SOURCE.MAX_AGE})))
          description: total menos falhas; sem dados completos, recentes e sincronizados o calculo fica indisponivel,
            preservando o historico anterior.
