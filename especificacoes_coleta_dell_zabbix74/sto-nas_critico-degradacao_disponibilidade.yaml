# unity - zabbix 7.4 - jsonpath fixo - somente operacoes nativas
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 40d2ea9a4b3549f4a58c288afee574ed
      name: templates/storage
  templates:
    - uuid: afb36295a9e842a5a62c068731de94af
      template: sto-nas_critico-degradacao_disponibilidade
      name: sto-nas_critico-degradacao_disponibilidade
      description: |-
        unity: eventos de disponibilidade.
        jsonpath fixo, sem lld, com uma trigger por evento.
        endereco base e token nas macros globais do zabbix.
        nome tecnico do host igual ao identificador usado pela api.
        textos de apresentacao em minusculas e sem acentos.
        metricas: historico de 90d e tendencias de 365d.
      groups:
        - name: templates/storage
      items:
        - type: HTTP_AGENT
          key: unity.disponibilidade.api.json
          delay: '{$UNITY.API.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          url: '{$UNITY.API.BASE_URL}/devices/unity/{HOST.HOST}'
          request_method: GET
          timeout: '{$UNITY.API.TIMEOUT}'
          status_codes: '200'
          retrieve_mode: BODY
          output_format: RAW
          headers:
            - name: x-api-token
              value: '{$UNITY.API.TOKEN}'
            - name: accept
              value: application/json
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^\s*(\{.*\})\s*$
                - '[\1]'
            - type: JSONPATH
              parameters:
                - $[0]
            - type: MATCHES_REGEX
              parameters:
                - (?s)^(?=.*"device_info"\s*:\s*\{)(?=.*"events"\s*:\s*\{).*
          uuid: 5f26de1abc7f4ce3b6fa1a1e663bf449
          name: 'unity: json completo: disponibilidade'
          description: consulta get ao json original da api; corpo completo somente em transito, sem historico.
          tags:
            - tag: categoria
              value: disponibilidade
          verify_peer: 'YES'
          verify_host: 'YES'
          follow_redirects: 'NO'
        - uuid: cb52a92249e148909ed085e085d0ca0f
          name: 'unity: resposta json utilizavel: disponibilidade'
          type: DEPENDENT
          key: unity.disponibilidade.api.receipt
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            sinal de recebimento; continua atualizando com http 200 e corpo identico. nao e uma medida do equipamento.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.disponibilidade.api.json
          tags:
            - tag: categoria
              value: disponibilidade
        - uuid: 38902ce785d1447ba0b7b05ff8e79734
          name: 'unity: contrato json valido: disponibilidade'
          type: DEPENDENT
          key: unity.disponibilidade.contract.valid
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = campos e metadados da categoria presentes no formato esperado; 0 = erro de contrato. nao bloqueia as outras categorias.
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^(.*)$
                - '[\1]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: JSONPATH
              parameters:
                - $[?(@.device_info.name=~"^(?!null$)\\S.*$" && @.events.cluster_down.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.cluster_down.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.cluster_down.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.controller_down.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.controller_down.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.controller_down.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.multiple_disk_failure.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.multiple_disk_failure.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.multiple_disk_failure.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.power_supply_failure.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.power_supply_failure.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.power_supply_failure.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.fan_failure.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.fan_failure.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.fan_failure.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.high_temp.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.high_temp.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.high_temp.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$")].length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.disponibilidade.api.json
          tags:
            - tag: categoria
              value: disponibilidade
        - uuid: 5eb1acf6e3d741309b5e95fe7d2922cb
          name: 'unity: alteracao do corpo json: disponibilidade'
          type: DEPENDENT
          key: unity.disponibilidade.json.change
          delay: '0'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |-
            controle interno: descarta corpos identicos; o primeiro corpo inicia a observacao.
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters: []
          master_item:
            key: unity.disponibilidade.api.json
          tags:
            - tag: categoria
              value: disponibilidade
        - uuid: 6d4bb16a1b48431ca21d0abbf18c7f45
          name: 'unity: sinal de alteracao do json: disponibilidade'
          type: DEPENDENT
          key: unity.disponibilidade.json.revision
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            registra 1 apenas quando o corpo json muda. lastclock mede a ultima mudanca observada.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.disponibilidade.json.change
          tags:
            - tag: categoria
              value: disponibilidade
        - uuid: efb815c541834f6291b530b5832b5838
          name: 'unity: horario observado da ultima alteracao: disponibilidade'
          type: CALCULATED
          key: unity.disponibilidade.json.timestamp
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          units: unixtime
          params: lastclock(//unity.disponibilidade.json.revision)
          description: horario unix em que o zabbix observou a ultima alteracao; nao converte o timestamp iso do
            construtor.
          tags:
            - tag: categoria
              value: disponibilidade
        - uuid: 80848714772c4505bf88aff40c2911d3
          name: 'unity: tempo sem alteracao do json: disponibilidade'
          type: CALCULATED
          key: unity.disponibilidade.json.age
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: s
          params: now()-lastclock(//unity.disponibilidade.json.revision)
          description: segundos desde a ultima alteracao observada; cresce mesmo quando a api responde 200 com o
            mesmo corpo.
          tags:
            - tag: categoria
              value: disponibilidade
