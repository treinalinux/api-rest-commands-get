          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: 365d
          value_type: FLOAT
          params: (last(//unity.disponibilidade.metric[power_supply_failure,total_psus])-last(//unity.disponibilidade.metric[power_supply_failure,failed_psus]))/(last(//unity.disponibilidade.available[power_supply_failure])=1
            and nodata(//unity.disponibilidade.metric[power_supply_failure,total_psus],1h)=0 and nodata(//unity.disponibilidade.metric[power_supply_failure,failed_psus],1h)=0
            and lastclock(//unity.disponibilidade.metric[power_supply_failure,total_psus])=lastclock(//unity.disponibilidade.metric[power_supply_failure,failed_psus])
            and last(//unity.disponibilidade.metric[power_supply_failure,total_psus])>=last(//unity.disponibilidade.metric[power_supply_failure,failed_psus])
            and last(//unity.disponibilidade.metric[power_supply_failure,failed_psus])>=0 and floor(last(//unity.disponibilidade.metric[power_supply_failure,total_psus]))=last(//unity.disponibilidade.metric[power_supply_failure,total_psus])
            and floor(last(//unity.disponibilidade.metric[power_supply_failure,failed_psus]))=last(//unity.disponibilidade.metric[power_supply_failure,failed_psus])
            and ((nodata(//unity.disponibilidade.json.revision,1h)=0 and now()-lastclock(//unity.disponibilidade.json.revision)<=1h)
            and (nodata(//unity.disponibilidade.api.receipt,{$UNITY.API.NODATA})=0 and now()-lastclock(//unity.disponibilidade.api.receipt)<={$UNITY.API.NODATA})
            and (nodata(//unity.disponibilidade.source.timestamp[power_supply_failure],{$UNITY.SOURCE.MAX_AGE})=0
            and now()-lastclock(//unity.disponibilidade.source.timestamp[power_supply_failure])<={$UNITY.SOURCE.MAX_AGE})))
