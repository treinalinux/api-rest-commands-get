        or (last(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.available[high_temp])=1 and (avg(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.metric[high_temp,current_temperature_celsius],10m)<={$UNITY.TEMP.MAX})))
        and ((nodata(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.json.revision,1h)=0 and now()-lastclock(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.json.revision)<=1h)
        and (nodata(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.api.receipt,{$UNITY.API.NODATA})=0
        and now()-lastclock(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.api.receipt)<={$UNITY.API.NODATA})
        and (nodata(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.source.timestamp[high_temp],{$UNITY.SOURCE.MAX_AGE})=0
        and now()-lastclock(/sto-nas_critico-degradacao_disponibilidade/unity.disponibilidade.source.timestamp[high_temp])<={$UNITY.SOURCE.MAX_AGE}))
      priority: HIGH
      description: |-
        temperatura media em 10m acima de 40c.
        usa o limite configurado na macro, quando aplicavel.
        dados desconhecidos ou velhos nao comprovam recuperacao.
      opdata: |-
        valor: {ITEM.LASTVALUE1}; detalhes: {{ITEM.LASTVALUE2}.regsub("(?s)(.*)", \1)}
      tags:
        - tag: categoria
          value: disponibilidade
        - tag: evento
          value: high_temp
