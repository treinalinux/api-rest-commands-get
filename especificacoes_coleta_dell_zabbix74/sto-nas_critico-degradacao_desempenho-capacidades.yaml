              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
            - tag: evento
              value: nfs_retransmissions
        - uuid: 8515b99908e34bde87caa938fcbfc7c6
          name: 'unity: retransmissoes nfs: retransmissoes nfs'
          type: DEPENDENT
          key: unity.desempenho.metric[nfs_retransmissions,nfs_retransmissions_pct]
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          description: |-
            metrica numerica com historico; null, unknown e coleta incompleta sao descartados. uma copia identica do evento nao cria amostras; zero real e preservado.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.nfs_retransmissions.event_details.collection.status=="collected" && @.nfs_retransmissions.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.nfs_retransmissions.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.nfs_retransmissions.event_details.metrics.nfs_retransmissions_pct=~"^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$"
                  && @.nfs_retransmissions.event_details.metrics.nfs_retransmissions_pct>=0 && @.nfs_retransmissions.event_details.metrics.nfs_retransmissions_pct<=100)].nfs_retransmissions.first()
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
              parameters: []
            - type: JSONPATH
              parameters:
                - $.event_details.metrics.nfs_retransmissions_pct
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
            - tag: evento
              value: nfs_retransmissions
            - tag: metrica
              value: nfs_retransmissions_pct
          units: '%'
