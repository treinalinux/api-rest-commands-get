# unity - zabbix 7.4 - jsonpath fixo - somente operacoes nativas
zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 40d2ea9a4b3549f4a58c288afee574ed
      name: templates/storage
  templates:
    - uuid: d79889efcec74e47848bcf183d95ff9a
      template: sto-nas_critico-degradacao_desempenho-capacidades
      name: sto-nas_critico-degradacao_desempenho-capacidades
      description: |-
        unity: eventos de desempenho.
        jsonpath fixo, sem lld, com uma trigger por evento.
        endereco base e token nas macros globais do zabbix.
        nome tecnico do host igual ao identificador usado pela api.
        textos de apresentacao em minusculas e sem acentos.
        metricas: historico de 90d e tendencias de 365d.
      groups:
        - name: templates/storage
      items:
        - type: HTTP_AGENT
          key: unity.desempenho.api.json
          delay: '{$UNITY.API.INTERVAL}'
          history: '0'
          trends: '0'
          value_type: TEXT
          url: '{$UNITY.API.BASE_URL}/devices/unity/{HOST.HOST}'
          request_method: GET
          timeout: '{$UNITY.API.TIMEOUT}'
          status_codes: '200'
          retrieve_mode: BODY
          output_format: RAW
          headers:
            - name: x-api-token
              value: '{$UNITY.API.TOKEN}'
            - name: accept
              value: application/json
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^\s*(\{.*\})\s*$
                - '[\1]'
            - type: JSONPATH
              parameters:
                - $[0]
            - type: MATCHES_REGEX
              parameters:
                - (?s)^(?=.*"device_info"\s*:\s*\{)(?=.*"events"\s*:\s*\{).*
          uuid: 9bfad3882af44b3cae3a7df11b84c6f8
          name: 'unity: json completo: desempenho'
          description: consulta get ao json original da api; corpo completo somente em transito, sem historico.
          tags:
            - tag: categoria
              value: desempenho
          verify_peer: 'YES'
          verify_host: 'YES'
          follow_redirects: 'NO'
        - uuid: 3f4d113d6713402b822b7b6a4f311941
          name: 'unity: resposta json utilizavel: desempenho'
          type: DEPENDENT
          key: unity.desempenho.api.receipt
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            sinal de recebimento; continua atualizando com http 200 e corpo identico. nao e uma medida do equipamento.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
        - uuid: c3f764ea1b86463386428713f2ee4c39
          name: 'unity: contrato json valido: desempenho'
          type: DEPENDENT
          key: unity.desempenho.contract.valid
          delay: '0'
          history: 7d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            1 = campos e metadados da categoria presentes no formato esperado; 0 = erro de contrato. nao bloqueia as outras categorias.
          preprocessing:
            - type: REGEX
              parameters:
                - (?s)^(.*)$
                - '[\1]'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: JSONPATH
              parameters:
                - $[?(@.device_info.name=~"^(?!null$)\\S.*$" && @.events.smb_latency.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.smb_latency.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.smb_latency.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.nfs_latency.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.nfs_latency.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.nfs_latency.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.nfs_retransmissions.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.nfs_retransmissions.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.nfs_retransmissions.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.cpu_utilization.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.cpu_utilization.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.cpu_utilization.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.storage_utilization.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.storage_utilization.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.storage_utilization.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.network_utilization.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.network_utilization.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.network_utilization.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.packet_loss.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.packet_loss.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.packet_loss.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.controller_cpu.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.controller_cpu.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.controller_cpu.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.volume_usage.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.volume_usage.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.volume_usage.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.pool_usage.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.pool_usage.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.pool_usage.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.events.pool_full.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$"
                  && @.events.pool_full.event_details.collection.status=~"^(collected|partial|unavailable|unsupported|not_applicable)$"
                  && @.events.pool_full.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$")].length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
        - uuid: 9baf552008b94113aec6b24cc8ff857d
          name: 'unity: alteracao do corpo json: desempenho'
          type: DEPENDENT
          key: unity.desempenho.json.change
          delay: '0'
          history: '0'
          trends: '0'
          value_type: TEXT
          description: |-
            controle interno: descarta corpos identicos; o primeiro corpo inicia a observacao.
          preprocessing:
            - type: DISCARD_UNCHANGED
              parameters: []
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
        - uuid: 3d7e43e04c80400e979ec8b94c0c38e0
          name: 'unity: sinal de alteracao do json: desempenho'
          type: DEPENDENT
          key: unity.desempenho.json.revision
          delay: '0'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          description: |-
            registra 1 apenas quando o corpo json muda. lastclock mede a ultima mudanca observada.
          preprocessing:
            - type: REGEX
              parameters:
                - ^
                - '1'
              error_handler: DISCARD_VALUE
          master_item:
            key: unity.desempenho.json.change
          tags:
            - tag: categoria
              value: desempenho
        - uuid: 0dac9c626141443b8515e2d04577e42b
          name: 'unity: horario observado da ultima alteracao: desempenho'
          type: CALCULATED
          key: unity.desempenho.json.timestamp
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: '0'
          value_type: UNSIGNED
          units: unixtime
          params: lastclock(//unity.desempenho.json.revision)
          description: horario unix em que o zabbix observou a ultima alteracao; nao converte o timestamp iso do
            construtor.
          tags:
            - tag: categoria
              value: desempenho
        - uuid: 39c641ebaa50437382904359e44663f3
          name: 'unity: tempo sem alteracao do json: desempenho'
          type: CALCULATED
          key: unity.desempenho.json.age
          delay: '{$UNITY.API.INTERVAL}'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: s
          params: now()-lastclock(//unity.desempenho.json.revision)
          description: segundos desde a ultima alteracao observada; cresce mesmo quando a api responde 200 com o
            mesmo corpo.
          tags:
            - tag: categoria
              value: desempenho
        - uuid: 9b5775a0c0c64521bcac0374ec5671bc
          name: 'unity: smb latency: timestamp da fonte'
          type: DEPENDENT
          key: unity.desempenho.source.timestamp[smb_latency]
          delay: '0'
          history: 1d
          trends: '0'
          value_type: TEXT
          description: |-
            timestamp iso original; registra apenas mudancas da fonte. lastclock mede quando essa mudanca foi observada, sem converter a data iso.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.events.smb_latency.event_metadata.timestamp
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$
              error_handler: DISCARD_VALUE
            - type: STR_REPLACE
              parameters:
                - T
                - t
            - type: STR_REPLACE
              parameters:
                - Z
                - z
            - type: DISCARD_UNCHANGED
              parameters: []
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
            - tag: evento
              value: smb_latency
        - uuid: 711f5a3201bb4a77a612ced59147f6bf
          name: 'unity: smb latency: coleta'
          type: DEPENDENT
          key: unity.desempenho.source.collection[smb_latency]
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |-
            qualidade da coleta: collected, partial, unavailable, unsupported, not_applicable ou invalid.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.events.smb_latency.event_details.collection.status
              error_handler: CUSTOM_VALUE
              error_handler_params: invalid
            - type: MATCHES_REGEX
              parameters:
                - ^(collected|partial|unavailable|unsupported|not_applicable)$
              error_handler: CUSTOM_VALUE
              error_handler_params: invalid
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
            - tag: evento
              value: smb_latency
        - uuid: 493f7d3a23a14353aebbaacf851f5609
          name: 'unity: smb latency: estado'
          type: DEPENDENT
          key: unity.desempenho.state[smb_latency]
          delay: '0'
          history: 7d
          trends: '0'
          value_type: TEXT
          description: |-
            estado original normalizado para apresentacao; unknown nao representa saudavel.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.events.smb_latency.component_health_status
              error_handler: CUSTOM_VALUE
              error_handler_params: unknown
            - type: REGEX
              parameters:
                - ^(OK|WARNING|CRITICAL|OPERATIONAL|UNKNOWN|NOT_APPLICABLE)$
                - \1
              error_handler: CUSTOM_VALUE
              error_handler_params: unknown
            - type: STR_REPLACE
              parameters:
                - OK
                - ok
            - type: STR_REPLACE
              parameters:
                - WARNING
                - warning
            - type: STR_REPLACE
              parameters:
                - CRITICAL
                - critical
            - type: STR_REPLACE
              parameters:
                - OPERATIONAL
                - operational
            - type: STR_REPLACE
              parameters:
                - UNKNOWN
                - unknown
            - type: STR_REPLACE
              parameters:
                - NOT_APPLICABLE
                - not_applicable
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: unity.desempenho.api.json
          tags:
            - tag: categoria
              value: desempenho
            - tag: evento
              value: smb_latency
