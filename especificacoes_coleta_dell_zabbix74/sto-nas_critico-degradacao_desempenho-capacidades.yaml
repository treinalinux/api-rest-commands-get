              value: volume_usage
        - uuid: 87d3f0ed71b24c23bb24726862a9515f
          name: 'unity: ocupacao do volume: ocupacao'
          type: DEPENDENT
          key: unity.desempenho.metric[volume_usage,usage_percentage]
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          description: |-
            metrica numerica com historico; null, unknown e coleta incompleta sao descartados. uma copia identica do evento nao cria amostras; zero real e preservado.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.volume_usage.event_details.collection.status=="collected" && @.volume_usage.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.volume_usage.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.volume_usage.event_details.metrics.usage_percentage=~"^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$"
                  && @.volume_usage.event_details.metrics.usage_percentage>=0)].volume_usage.first()
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED
              parameters: []
            - type: JSONPATH
              parameters:
                - $.event_details.metrics.usage_percentage
              error_handler: DISCARD_VALUE
            - type: MATCHES_REGEX
              parameters:
                - ^[+-]?(?:[0-9]+(?:\.[0-9]*)?|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1'
              error_handler: DISCARD_VALUE
