          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          description: |-
            metrica numerica com historico; null, unknown e coleta incompleta sao descartados. uma copia identica do evento nao cria amostras; zero real e preservado.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.network_utilization.event_details.collection.status=="collected" && @.network_utilization.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.network_utilization.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
