                  && @.volume_usage.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
                  && @.volume_usage.event_details.metrics.usage_percentage=~"^[+-]?(?:[0-9]+(?:\\.[0-9]*)?|\\.[0-9]+)(?:[eE][+-]?[0-9]+)?$"
                  && @.volume_usage.event_details.metrics.usage_percentage>=0)].volume_usage.event_details.collection.status.first()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: REGEX
              parameters:
