          preprocessing:
            - type: JSONPATH
              parameters:
                - $[?(@.pool_usage.event_details.collection.status=="collected" && @.pool_usage.component_health_status=~"^(OK|WARNING|CRITICAL|OPERATIONAL)$"
                  && @.pool_usage.event_metadata.timestamp=~"^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\\.[0-9]+)?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$"
